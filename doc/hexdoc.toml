modid = "dthexcasting"
book = "hexcasting:thehexbook"
default_lang = "en_us"
default_branch = "main"

resource_dirs = [  # top takes priority
    "resources",
    "../src/main/resources",
    { path="../src/generated/resources", required=false },
    { modid="hexcasting" },
    { modid="minecraft" },
    { modid="hexdoc" },
]
export_dir = "src/hexdoc_dthexcasting/_export/generated"

[template]
icon = "icon.png"
include = [
    "dthexcasting",
    "hexcasting",
    "hexdoc",
]

[template.args]
mod_name = "DTHexcasting"
author = "TechTastic"
show_landing_text = false

[extra.hexcasting]
# regexes for parsing pattern registry files - try running copier update and picking a different regex if your patterns aren't loading
# NOTE: "!Raw" means "don't apply variable interpolation to this value"
_pattern_regex = { "!Raw"='register\(\s*"(?P<name>[a-zA-Z0-9_\/]+)",\s*\(\)\s*->\s*new ActionRegistryEntry\(HexPattern\.fromAngles\(\s*"(?P<signature>[aqweds]+)",\s*HexDir.(?P<startdir>\w+)\)' }
_per_world_value = "true"

[[extra.hexcasting.pattern_stubs]]
path = "{^^^_common.package}/init/DTHActionRegistry.java"
regex = "{^_pattern_regex}"
per_world_value = "{^_per_world_value}"

[textures]
missing = [
    "dthexcasting:edified_amethyst_branch",
    "dthexcasting:edified_aventurine_branch",
    "dthexcasting:edified_citrine_branch",
    "dynamictrees:oak_seed",
    "dynamictrees:dark_oak_seed"
]

[textures.override]
"dynamictrees:oak_seed" = { texture = "dynamictrees:textures/item/oak_seed.png" }
"dynamictrees:dark_oak_seed" = { texture = "dynamictrees:textures/item/dark_oak_seed.png" }

# platforms

[_common]
src = "../src"
package = "{src}/main/java/io/github/techtastic/dthexcasting"
